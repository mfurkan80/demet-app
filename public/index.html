<style>
/* Layout: the live 3D scene owns the stage (top on phones, left on desktop); a florist's
   workbench panel holds the steps (bottom sheet on phones, right rail on desktop).
   The same frame swaps between the studio and the couple's shared garden. */
:root {
  --top: max(14px, calc(env(safe-area-inset-top, 0px) + 6px));
  --mist: #E6EEE8;
  --blush: #F7E5EB;
  --sky-1: #E9F1EA;
  --sky-2: #F8E9EE;
  --surface: #FBFCFA;
  --surface-2: #EFF4F0;
  --ink: #1C2922;
  --ink-2: #56665D;
  --line: #D6E0D9;
  --accent: #B5244D;
  --accent-ink: #FFFFFF;
  --accent-soft: #F7DCE4;
  --gold: #A8761A;
  --gold-soft: #FBF0D3;
  --gold-line: #EBD39A;
  --note-bg: #FFF3D4;
  --note-ink: #5F4600;
  --scrim: rgba(18, 28, 22, .42);
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --panel-w: 430px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --mist: #101814; --blush: #22151B; --sky-1: #0F1915; --sky-2: #1E141B; --surface: #161F1A; --surface-2: #1D2822;
    --ink: #EAF1EC; --ink-2: #9AAEA2; --line: #2A3630; --accent: #F0728F; --accent-ink: #2B0B15; --accent-soft: #3A1A25;
    --gold: #E9B949; --gold-soft: #33280E; --gold-line: #5A4619; --note-bg: #352C12; --note-ink: #F1D88E;
    --scrim: rgba(0, 0, 0, .58); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --mist: #101814; --blush: #22151B; --sky-1: #0F1915; --sky-2: #1E141B; --surface: #161F1A; --surface-2: #1D2822;
  --ink: #EAF1EC; --ink-2: #9AAEA2; --line: #2A3630; --accent: #F0728F; --accent-ink: #2B0B15; --accent-soft: #3A1A25;
  --gold: #E9B949; --gold-soft: #33280E; --gold-line: #5A4619; --note-bg: #352C12; --note-ink: #F1D88E;
  --scrim: rgba(0, 0, 0, .58); color-scheme: dark;
}
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* uygulamada: uzun basınca metin seçilmesin, menü çıkmasın; sayfa esnemesin */
html.native body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html.native input, html.native textarea, html.native [contenteditable], html.native .msg, html.native .selectable { -webkit-user-select: text; user-select: text; }
html.native img { -webkit-user-drag: none; -webkit-touch-callout: none; }
body {
  background: var(--surface); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  line-height: 1.45; overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
@media (min-width: 900px) { .app { grid-template-rows: 1fr; grid-template-columns: minmax(0, 1fr) var(--panel-w); } }

/* ---------- stage ---------- */
.stage {
  position: relative; min-height: 0; overflow: hidden;
  background: radial-gradient(110% 85% at 50% 16%, var(--blush) 0%, var(--mist) 72%);
  transition: background .6s ease;
}
.stage.garden .brand h1, .stage.garden .brand p { text-shadow: 0 1px 14px color-mix(in srgb, var(--surface) 90%, transparent), 0 0 3px color-mix(in srgb, var(--surface) 70%, transparent); }
.stage.garden { background: linear-gradient(180deg, #C7DDF0 0%, #FBE0C8 60%, #8DB665 100%); }
@media (max-width: 899px) { .app.in-garden .panel { height: min(42vh, 400px); } }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.topbar {
  position: absolute; inset: 0 0 auto; z-index: 3; display: flex; align-items: flex-start;
  justify-content: space-between; gap: 10px; pointer-events: none;
  padding-top: var(--top);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar > * { pointer-events: auto; }
.brand h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1;
  letter-spacing: -0.04em; font-variation-settings: "opsz" 96;
}
.brand p { margin: 4px 0 0; color: var(--ink-2); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 13px 0 9px; border-radius: 999px;
  border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(10px);
  font-weight: 700; font-size: 14.5px; position: relative; font-variant-numeric: tabular-nums;
}
.pill.gold { border-color: var(--gold-line); background: color-mix(in srgb, var(--gold-soft) 88%, transparent); }
.pill .dot { position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
.pill svg { width: 18px; height: 18px; }
.coin {
  display: inline-block; width: 18px; height: 18px; border-radius: 50%; flex: none; vertical-align: -3px;
  background: radial-gradient(circle at 34% 30%, #FFF1B8 0 12%, #F2C552 38%, #C98E1E 72%, #8E5E0E 100%);
  box-shadow: inset 0 0 0 1.5px rgba(110, 70, 0, .35), inset 0 0 0 4px rgba(255, 236, 170, .35);
}
.coin.sm { width: 14px; height: 14px; vertical-align: -2px; }
.coin.lg { width: 30px; height: 30px; vertical-align: -7px; }

.empty {
  position: absolute; z-index: 2; left: 50%; top: 52%; transform: translate(-50%, -50%); text-align: center;
  display: grid; gap: 6px; width: min(80%, 320px); pointer-events: none; transition: opacity .4s ease;
}
.empty strong { font-family: var(--font-display); font-size: 24px; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; }
.empty span { color: var(--ink-2); font-size: 14px; }
.empty .ring {
  width: 92px; height: 92px; margin: 0 auto 10px; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent);
  display: grid; place-items: center; animation: breathe 3.2s ease-in-out infinite;
}
.empty .ring img { width: 64px; height: 64px; opacity: .85; }
@keyframes breathe { 50% { transform: scale(1.06); } }
.hint {
  position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); bottom: 26px; font-size: 12.5px; color: var(--ink-2);
  background: color-mix(in srgb, var(--surface) 78%, transparent); padding: 5px 12px; border-radius: 999px; white-space: nowrap;
  backdrop-filter: blur(6px); transition: opacity .6s ease; pointer-events: none;
}
@media (min-width: 900px) { .hint { bottom: 16px; } }
.loading {
  position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; text-align: center;
  color: var(--ink-2); font-size: 14px; transition: opacity .5s ease;
  background: radial-gradient(110% 85% at 50% 16%, var(--blush) 0%, var(--mist) 72%);
}
.loading strong { display: block; font-family: var(--font-display); font-size: 22px; color: var(--ink); margin-bottom: 4px; }
.loading .bar { width: 170px; height: 4px; border-radius: 4px; background: var(--line); margin: 12px auto 0; overflow: hidden; }
.loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }

.notif {
  position: absolute; z-index: 6; left: 50%; top: max(12px, env(safe-area-inset-top, 0px)); width: min(calc(100% - 24px), 420px);
  transform: translate(-50%, calc(-100% - 80px)); visibility: hidden; transition: transform .6s cubic-bezier(.2,.9,.25,1.15), visibility 0s linear .6s;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px);
  border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 2px 12px;
  box-shadow: 0 16px 40px -18px rgba(0,0,0,.45);
}
.notif.show { transform: translate(-50%, 0); visibility: visible; transition: transform .6s cubic-bezier(.2,.9,.25,1.15), visibility 0s; }
.notif .ic { grid-row: span 3; width: 40px; height: 40px; border-radius: 11px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.notif .t1 { font-size: 12.5px; color: var(--ink-2); display: flex; justify-content: space-between; }
.notif .t2 { font-weight: 700; }
.notif .t3 { font-size: 14px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- panel ---------- */
.panel {
  background: var(--surface); border-top: 1px solid var(--line); display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto; height: min(50vh, 470px); min-height: 0;
  border-radius: var(--r-lg) var(--r-lg) 0 0; margin-top: -20px; position: relative; z-index: 4;
  box-shadow: 0 -14px 30px -22px rgba(20, 40, 30, .45);
}
@media (min-width: 900px) {
  .panel { height: auto; border-radius: 0; margin-top: 0; border-top: 0; border-left: 1px solid var(--line); box-shadow: none; }
}
.tabs {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding-block: 14px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 7px 13px; font-size: 14px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px;
}
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.tab .n { font-size: 12px; font-variant-numeric: tabular-nums; opacity: .75; }
@media (max-width: 420px) {
  .tabs { gap: 5px; }
  .tab { padding: 7px 11px; font-size: 13.5px; }
}
.pane {
  overflow-y: auto; min-height: 0; overscroll-behavior: contain;
  padding-block: 2px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; align-content: start;
}
.foot {
  border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.foot .meta { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); line-height: 1.3; }
.foot .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.cta {
  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15.5px;
  height: 48px; padding: 0 22px; display: inline-flex; align-items: center; gap: 8px; flex: none;
  box-shadow: 0 8px 20px -10px var(--accent); transition: transform .15s ease, opacity .2s ease;
}
.cta:active { transform: scale(.97); }
.cta:disabled { opacity: .45; box-shadow: none; cursor: default; }
.cta .cost { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.22); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.btn2 {
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; height: 44px; padding: 0 18px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.group { display: grid; gap: 10px; }
.group > h2 { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.group > h2 b { color: var(--ink); font-weight: 600; }
.sticky { position: sticky; top: 0; z-index: 2; background: var(--surface); padding-block: 4px 8px; margin-bottom: -8px; }

/* flower cards */
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
.fcard { position: relative; border-radius: var(--r-md); }
.fcard .add {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: var(--r-md);
  padding: 6px 6px 8px; display: grid; justify-items: center; gap: 2px; text-align: center;
  transition: border-color .15s ease, transform .12s ease;
}
.fcard .add:active { transform: scale(.96); }
.fcard[data-active="true"] .add { border-color: var(--accent); background: var(--accent-soft); }
.fcard img { width: 64px; height: 64px; display: block; }
.fcard .nm { font-weight: 600; font-size: 13.5px; line-height: 1.15; }
.fcard .pr { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; min-height: 15px; }
.fcard .pr.prem { color: var(--gold); font-weight: 700; }
.fcard .cnt {
  position: absolute; top: 6px; right: 6px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; box-sizing: border-box;
  background: var(--ink); color: var(--surface); font-weight: 700; font-size: 13px; display: grid; place-items: center;
  font-variant-numeric: tabular-nums; pointer-events: none;
}
.fcard .minus {
  position: absolute; top: 5px; left: 5px; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line);
  background: var(--surface); display: grid; place-items: center; padding: 0; font-size: 17px; line-height: 1; color: var(--ink);
  box-shadow: 0 2px 6px -2px rgba(0,0,0,.18);
}

.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; position: relative; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
.sw[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--ink); }
.sw.metal { background: radial-gradient(circle at 35% 30%, #fff 0 8%, var(--c) 45%, color-mix(in srgb, var(--c) 55%, #000) 100%); }
.sw.velvet { background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--c) 55%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000) 100%); }
.sw.goldedge { background: linear-gradient(180deg, #E8C46A 0 22%, #B98A2E 22% 30%, var(--c) 30%); }
.sw.news { background: repeating-linear-gradient(0deg, var(--c) 0 3px, color-mix(in srgb, var(--c) 70%, #555) 3px 4px); }
.sw.crystal { background: linear-gradient(135deg, color-mix(in srgb, var(--c) 70%, #fff), #CFE8FF 40%, #F6D6FF 70%, var(--c)); opacity: .9; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; color: var(--ink);
}
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.chip .lock { display: inline-flex; align-items: center; gap: 3px; color: var(--gold); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .lock { color: var(--gold-line); }

.wrapcard {
  border-radius: var(--r-md); padding: 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: center;
  background: var(--accent-soft); border: 1.5px solid color-mix(in srgb, var(--accent) 30%, transparent);
}
.wrapcard strong { font-size: 15px; }
.wrapcard span { font-size: 13px; color: var(--ink-2); grid-column: 1; }
.wrapcard .cta { grid-row: span 2; grid-column: 2; height: 42px; }
.tip { background: var(--note-bg); color: var(--note-ink); border-radius: var(--r-sm); padding: 9px 12px; font-size: 13.5px; }
.linkbtn { border: 0; background: none; color: var(--ink-2); padding: 4px 0; font-size: 13.5px; text-decoration: underline; justify-self: start; }

.row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .ico { width: 46px; height: 46px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.row .ico img { width: 46px; height: 46px; }
.row .lbl { display: grid; min-width: 0; }
.row .lbl span { font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row .lbl small { color: var(--ink-2); font-size: 13px; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.badge.own { color: var(--ink-2); font-weight: 600; }
.unlock {
  border: 1.5px solid var(--gold-line); background: var(--gold-soft); color: var(--ink); border-radius: 999px; height: 34px; padding: 0 12px;
  font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums;
}
.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; border: 0; padding: 0; flex: none; background: var(--line); transition: background .2s ease; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s ease; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper button { width: 32px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; line-height: 1; display: grid; place-items: center; padding: 0; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.ico-pearl { background: radial-gradient(circle at 30% 30%, #fff 0 10%, #EDE6DD 40%, #C9BCAD 100%); width: 14px; height: 14px; border-radius: 50%; box-shadow: 10px 6px 0 -2px #E6DED3, -9px 7px 0 -3px #E6DED3; }
.ico-glow { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle, #FFE7A6 0 18%, rgba(255,200,110,.35) 40%, transparent 70%); }
.ico-star { font-size: 24px; color: var(--gold); line-height: 1; }

.field { display: grid; gap: 6px; }
.field label { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.field textarea, .field input {
  border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); padding: 10px 12px; resize: none; width: 100%; box-sizing: border-box;
}
.field textarea.hand, .field input.hand { font-family: var(--font-hand); font-size: 24px; line-height: 1.2; }
.field textarea.hand { min-height: 92px; }
/* telefonda yazı kutuları 16px: iPhone odaklanınca sayfayı büyütmesin */
@media (pointer: coarse) { html input:not(.hand), html textarea:not(.hand), html select { font-size: 16px; } }
.count { font-size: 12.5px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- garden ---------- */
.gsum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gsum div { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; display: grid; }
.gsum b { font-family: var(--font-display); font-size: 24px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.gsum span { font-size: 12.5px; color: var(--ink-2); }
.week { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.week span { flex-basis: 100%; margin-top: 4px; }
.week i { min-width: 0; flex: 1; height: 26px; padding: 0 2px; border-radius: 999px; border: 1.5px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 11.5px; font-weight: 700; }
.week i.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hist { display: grid; gap: 2px; }
.entry {
  display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; width: 100%;
  border: 0; background: transparent; border-radius: var(--r-md); padding: 8px; margin-inline: -8px; width: calc(100% + 16px);
}
.entry:hover { background: var(--surface-2); }
.thumb { width: 58px; height: 58px; border-radius: 14px; overflow: hidden; background: linear-gradient(160deg, var(--blush), var(--mist)); position: relative; flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.col img { position: absolute; width: 40px; height: 40px; object-fit: contain; }
.thumb.col img:nth-child(1) { left: 2px; top: 10px; } .thumb.col img:nth-child(2) { left: 16px; top: 2px; } .thumb.col img:nth-child(3) { left: 18px; top: 18px; }
.entry .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 700; }
.entry .when { font-size: 12.5px; color: var(--ink-2); font-weight: 500; margin-left: auto; font-variant-numeric: tabular-nums; }
.entry .msg { font-family: var(--font-hand); font-size: 20px; line-height: 1.15; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .msg.empty-msg { font-family: var(--font-body); font-size: 13px; color: var(--ink-2); }
.tag { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.tag.in { background: var(--accent-soft); color: var(--accent); }
.tag.reason { background: var(--note-bg); color: var(--note-ink); }
.tag.sample { border: 1px dashed var(--line); background: transparent; }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); opacity: 0; transition: opacity .25s ease; }
.scrim.show { opacity: 1; }
.sheet {
  position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: 0 -20px 50px -20px rgba(0,0,0,.4);
  transform: translateY(105%); transition: transform .38s cubic-bezier(.2,.85,.25,1);
  padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px;
}
.sheet.show { transform: translateY(0); }
.sheet:focus { outline: none; }
@media (min-width: 700px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 460px; max-height: 86vh; border-radius: var(--r-lg);
    transform: translate(-50%, -46%) scale(.97); opacity: 0; transition: transform .3s ease, opacity .25s ease; padding-block: 18px 22px; }
  .sheet.show { transform: translate(-50%, -50%); opacity: 1; }
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
@media (min-width: 700px) { .grab { display: none; } }
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 24px; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; padding-right: 40px; }
.sheet .sub { margin: -6px 0 0; color: var(--ink-2); font-size: 14px; }
.sheet .x { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; font-size: 20px; line-height: 1; }
.bal { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 34px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.bal small { font-family: var(--font-body); font-size: 14px; color: var(--ink-2); font-weight: 500; letter-spacing: 0; }
.daily { border-radius: var(--r-md); padding: 14px; background: var(--gold-soft); border: 1.5px solid var(--gold-line); display: grid; gap: 10px; }
.daily .h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.daily .h strong { font-size: 15px; }
.daily .h span { font-size: 13px; color: var(--ink-2); display: block; font-weight: 500; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.days i { height: 34px; border-radius: 9px; background: var(--surface); border: 1px solid var(--gold-line); display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.days i.done { background: var(--gold); border-color: var(--gold); color: var(--surface); }
.days i.big { color: var(--gold); }
.packs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pack {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 12px; display: grid; gap: 4px; text-align: left; position: relative;
}
.pack.best { border-color: var(--gold); }
.pack .amt { font-family: var(--font-display); font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.pack .bonus { font-size: 12.5px; color: var(--gold); font-weight: 700; min-height: 17px; }
.pack .price { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.pack.busy { opacity: .6; }
.pack .flag { position: absolute; top: -9px; right: 10px; background: var(--gold); color: var(--surface); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.small { font-size: 12.5px; color: var(--ink-2); margin: 0; }
.uses { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
.uses li { display: flex; gap: 8px; align-items: center; }
.uses li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex: none; }
.lines { display: grid; gap: 6px; font-size: 14px; }
.lines div { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.lines .tot { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 700; }
.lines .warn { color: var(--accent); font-weight: 600; }
.snap { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: var(--r-md); object-fit: cover; display: block; background: linear-gradient(160deg, var(--blush), var(--mist)); }
.snaprow { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 14px; align-items: center; }
.snaprow img { width: 96px; height: 96px; border-radius: 16px; object-fit: cover; }
.hand-note { font-family: var(--font-hand); font-size: 28px; line-height: 1.15; margin: 0; }
.sheet .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet .acts .cta, .sheet .acts .btn2 { flex: 1; justify-content: center; }
/* telefonda uzun pencerelerde ana düğme hep altta görünsün */
@media (max-width: 699px) {
  .sheet:has(> .acts:last-child) { padding-bottom: 0; }
  .sheet > .acts:last-child { position: sticky; bottom: 0; z-index: 3; background: var(--surface); padding-block: 8px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .sheet > .acts:last-child::before { content: ""; position: absolute; left: 0; right: 0; top: -18px; height: 18px; background: linear-gradient(color-mix(in srgb, var(--surface) 0%, transparent), var(--surface)); pointer-events: none; }
}
.unl { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 14px; align-items: center; }
.unl .ico { width: 72px; height: 72px; border-radius: 18px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.unl .ico img { width: 72px; height: 72px; }

/* ---------- account ---------- */
.av-btn { width: 38px; padding: 0; justify-content: center; font-family: var(--font-display); font-weight: 800; font-size: 16px; }
@media (max-width: 400px) { .pill .lbl { display: none; } #navBtn { width: 38px; padding: 0; justify-content: center; } }
@media (max-width: 400px) { .topbar { gap: 8px; } .actions { gap: 6px; } .pill.gold { padding: 0 11px 0 8px; } .pill.av-btn.guest { padding: 0 12px; font-size: 13.5px; } .brand p { font-size: 12.5px; white-space: nowrap; } }
.acc { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.acc h4 { margin: 0; font-size: 15px; }
.pair { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; align-items: center; }
.pair small { display: block; color: var(--ink-2); font-size: 13px; }
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-weight: 800; font-size: 19px; }
.code { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: .14em; text-align: center; padding: 10px; border-radius: var(--r-md); background: var(--surface-2); font-variant-numeric: tabular-nums; }
.formgrid { display: grid; gap: 10px; }
.formgrid .cta { justify-self: start; }
.choice { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; align-items: start; padding: 12px; border-radius: var(--r-md); border: 1.5px solid var(--line); cursor: pointer; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); }
.choice small { display: block; color: var(--ink-2); font-size: 13px; }
.inbox {
  position: absolute; z-index: 4; left: 50%; transform: translateX(-50%); top: calc(var(--top) + 54px);
  display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid color-mix(in srgb, var(--accent) 35%, transparent);
  background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px);
  box-shadow: 0 10px 24px -14px var(--accent); white-space: nowrap;
}
.inbox #inboxText { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.inbox b { color: var(--accent); }
.inbox .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent); } }

/* ---------- reactions, days, video ---------- */
.hearts { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
.hearts i { position: absolute; bottom: 18%; width: 26px; height: 26px; color: var(--accent); animation: floatUp 2.2s cubic-bezier(.2,.7,.3,1) forwards; }
.hearts svg { width: 100%; height: 100%; display: block; }
@keyframes floatUp { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), -55vh) scale(1.1) rotate(var(--r)); opacity: 0; } }
.chip svg { width: 16px; height: 16px; color: var(--accent); }
.chip[aria-pressed="true"] svg { color: currentColor; }
.react-box { background: var(--accent-soft); border-radius: var(--r-md); padding: 10px 12px; font-size: 14px; }
.react-box b { color: var(--accent); }
.days-list { display: grid; gap: 2px; }
.day-row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--line); }
.day-row:last-child { border-bottom: 0; }
.day-row b { display: block; font-size: 14.5px; }
.day-row small { color: var(--ink-2); font-size: 13px; }
.day-row .left { font-size: 12.5px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.day-row button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1; padding: 0; }
.dayform { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.dayform select { grid-column: 1 / -1; }
.dayform .btn2 { height: auto; min-height: 44px; }
.dayform select, .dayform input { border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); padding: 10px 12px; min-width: 0; width: 100%; box-sizing: border-box; font: inherit; color: var(--ink); }
.dayform .wide { grid-column: 1 / -1; }
.when-in { border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); padding: 10px 12px; font: inherit; color: var(--ink); width: 100%; box-sizing: border-box; }
.when-text { font-size: 13.5px; font-weight: 600; color: var(--accent); margin: 0; }
.storyvid { width: min(100%, 250px); aspect-ratio: 9 / 16; border-radius: 18px; justify-self: center; background: var(--surface-2); object-fit: cover; }
#recOverlay { z-index: 7; }

/* ---------- welcome + auth ---------- */
.app.welcoming { grid-template-rows: minmax(0, 1fr) 0; }
@media (min-width: 900px) { .app.welcoming { grid-template-columns: minmax(0, 1fr) 0; } }
.app.welcoming .panel { visibility: hidden; }
.app.welcoming .topbar, .app.welcoming .hint, .app.welcoming .inbox { opacity: 0; pointer-events: none; }
.welcome {
  position: fixed; inset: 0; z-index: 15; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; pointer-events: none;
  background: linear-gradient(180deg, rgba(20, 16, 24, .28) 0%, rgba(20, 16, 24, 0) 26%, rgba(20, 16, 24, 0) 48%, rgba(20, 16, 24, .38) 100%);
  opacity: 0; transition: opacity .5s ease;
}
.welcome.show { opacity: 1; }
.whead { pointer-events: none; text-align: center; color: #fff; padding-top: max(28px, calc(env(safe-area-inset-top, 0px) + 18px)); text-shadow: 0 2px 18px rgba(40, 10, 30, .35); }
.wmark { display: block; font-family: var(--font-display); font-weight: 800; font-size: 44px; letter-spacing: -0.045em; line-height: 1; font-variation-settings: "opsz" 96; }
.wtag { display: block; margin-top: 6px; font-family: var(--font-hand); font-size: 24px; opacity: .95; }
.wcard {
  grid-row: 3; pointer-events: auto; width: min(100%, 440px); box-sizing: border-box; max-height: calc(100dvh - 40px); overflow-y: auto; overscroll-behavior: contain;
  background: color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter: blur(18px);
  border-radius: 28px 28px 0 0; box-shadow: 0 -24px 60px -30px rgba(40, 10, 30, .55);
  padding-block: 24px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  transform: translateY(40px); transition: transform .6s cubic-bezier(.2, .85, .25, 1);
}
.welcome.show .wcard { transform: none; }
@media (min-width: 900px) {
  .welcome { grid-template-columns: minmax(0, 1fr) 480px; grid-template-rows: 1fr; align-items: center; background: linear-gradient(90deg, rgba(20,16,24,0) 45%, rgba(20,16,24,.35)); }
  .whead { grid-column: 1; grid-row: 1; align-self: start; justify-self: start; text-align: left; padding: 40px 0 0 44px; }
  .wmark { font-size: 56px; }
  .wcard { grid-column: 2; grid-row: 1; border-radius: 28px; margin-right: 40px; padding: 30px; }
}
.wstep { display: grid; gap: 14px; }
.wcard h2 { margin: 0; font-family: var(--font-display); font-size: 27px; line-height: 1.08; letter-spacing: -0.025em; text-wrap: balance; }
.wsub { margin: -4px 0 0; color: var(--ink-2); font-size: 15px; text-wrap: pretty; }
.wbtns { display: grid; gap: 10px; margin-top: 4px; }
.cta.wide, .btn2.wide { width: 100%; justify-content: center; height: 52px; font-size: 16px; }
.wguest { justify-self: center; text-decoration: none; font-weight: 600; padding: 6px 10px; }
.wguest:hover { color: var(--ink); }
.wback { justify-self: start; border: 0; background: var(--surface-2); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; padding: 0; margin-bottom: -4px; }
.wback svg { width: 18px; height: 18px; }
.wperks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14.5px; }
.wperks li { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; align-items: start; }
.wperks svg { width: 20px; height: 20px; color: var(--accent); margin-top: 1px; }
.auth .field input { height: 48px; font-size: 16px; }
.passrow { position: relative; }
.passrow input { padding-right: 76px !important; }
.peek { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 13.5px; padding: 8px 10px; border-radius: 8px; }
.peek:hover { color: var(--ink); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; border-radius: 999px; height: 38px; font-weight: 700; color: var(--ink-2); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.pill.av-btn.guest { width: auto; padding: 0 14px; font-family: var(--font-body); font-size: 14px; background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pill .glbl { white-space: nowrap; }

/* ---------- people + garden switch ---------- */
.people { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
.people::-webkit-scrollbar { display: none; }
.person { flex: none; width: 88px; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 10px 6px 8px; display: grid; justify-items: center; gap: 2px; text-align: center; }
.person .av { width: 42px; height: 42px; font-size: 18px; margin-bottom: 4px; }
.person .av svg { width: 20px; height: 20px; }
.person .pn { font-weight: 700; font-size: 13.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .pr { font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.person[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.person.add .av, .person.link .av { background: var(--surface-2); color: var(--ink-2); }
.av.heart { background: var(--accent); color: var(--accent-ink); }
.rcpt-hint { margin: -2px 0 0; font-size: 13px; color: var(--ink-2); }
.frow { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 10px; align-items: center; padding-block: 6px; }
.frow .av { width: 36px; height: 36px; font-size: 15px; }
.frow b { display: block; font-size: 14.5px; }
.frow small { color: var(--ink-2); font-size: 12.5px; }
.frow .rm { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1; padding: 0; color: var(--ink-2); }
.acc .acts { margin-top: 2px; }
.gswitch {
  position: absolute; z-index: 4; left: 50%; transform: translateX(-50%); top: calc(var(--top) + 56px);
  display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 80%, transparent);
  backdrop-filter: blur(12px); border: 1px solid color-mix(in srgb, var(--line) 70%, transparent); box-shadow: 0 10px 30px -18px rgba(0,0,0,.45);
}
.gswitch button { border: 0; background: transparent; border-radius: 999px; height: 34px; padding: 0 16px; font-weight: 700; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.gswitch button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.gswitch svg { width: 15px; height: 15px; }
@media (min-width: 900px) { .gswitch { top: 18px; } }
@media (max-width: 899px) { .stage.garden .brand p { display: none; } .stage.garden .brand h1 { font-size: 28px; } }
.app.welcoming .gswitch { opacity: 0; pointer-events: none; }
.invite-card { border-radius: var(--r-md); padding: 16px; background: var(--accent-soft); border: 1.5px solid color-mix(in srgb, var(--accent) 28%, transparent); display: grid; gap: 10px; }
.invite-card strong { font-family: var(--font-display); font-size: 19px; line-height: 1.15; letter-spacing: -0.01em; }
.invite-card p { margin: 0; font-size: 14px; color: var(--ink-2); }
.invite-card .cta { justify-self: start; }

/* ---------- received bouquet ---------- */
.gift { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)); transition: opacity .45s ease, transform .45s ease; }
.gift.out { opacity: 0; transform: scale(.94); pointer-events: none; }
@media (max-width: 899px) { .app.sealed .panel { height: auto; } .gift { padding-top: calc(var(--top) + 40px); } }
.env {
  width: min(100%, 340px); box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 34px 22px 22px; text-align: center; display: grid; gap: 8px; position: relative;
  box-shadow: 0 30px 60px -30px rgba(80, 10, 35, .55);
}
.env::before { content: ""; position: absolute; inset: 8px; border: 1.5px dashed color-mix(in srgb, var(--accent) 30%, transparent); border-radius: calc(var(--r-lg) - 6px); pointer-events: none; }
.seal {
  width: 62px; height: 62px; border-radius: 50%; margin: -66px auto 6px; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 34% 28%, #E66A88, #B5244D 58%, #74102D); font-family: var(--font-display); font-weight: 800; font-size: 26px;
  box-shadow: 0 8px 18px -8px #B5244D, inset 0 0 0 4px rgba(255,255,255,.12);

function streak() {

  const days = new Set(gardenEntries().filter(e => gMode === 'ours' || e.dir === 'out').map(e => dayKey(e.at)));
  let n = 0, d = Date.now();
  if (!days.has(dayKey(d))) d -= DAY;

function bindAuth(root, mode, p, done) {
  const f = root.querySelector(`#${p}Form`), er = f.querySelector('.err'), btn = f.querySelector('[type=submit]');
  const pw = f.querySelector(`#${p}Pass`), pk = f.querySelector('.peek');

    if (mode === 'register' && password.length < 8) return fail('Şifre en az 8 karakter olmalı.', `#${p}Pass`);
    if (!password) return fail('Şifreni yaz.', `#${p}Pass`);
    if (!online()) return fail('Sunucuya ulaşılamadı. Bağlantını kontrol edip tekrar dene.', `#${p}Email`);
    const label = btn.textContent; btn.disabled = true; btn.textContent = mode === 'register' ? 'Hesabın oluşturuluyor…' : 'Giriş yapılıyor…';
    try {
      if (mode === 'register') { applyMe(await api('/register', { body: { email, password, name } })); done('register'); }

  };
}

      if (reg && !pw.value) { er.textContent = 'Şifreni yaz.'; er.hidden = false; pw.focus(); return; }
      btn.disabled = true; btn.textContent = 'Siliniyor…';
      try {
        await api('/me', { method: 'DELETE', body: { password: reg ? pw.value : '' } });
        setToken(null);
        try { localStorage.removeItem('demet-v2'); localStorage.removeItem('demet-welcomed'); sessionStorage.setItem('demet-hello', JSON.stringify({ deleted: 1 })); } catch (e) {}
        location.href = '/';
      } catch (e) { er.textContent = e.message; er.hidden = false; btn.disabled = false; btn.textContent = 'Kalıcı olarak sil'; }
    };
  });
}

/* ---- first visit: the garden fills the screen behind a welcome card */
var welcomeOpen = false;
const PERK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 15c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/></svg>';
function showWelcome() {
  const el = $('welcome'); welcomeOpen = true;
  $('app').classList.add('welcoming');
  el.innerHTML = `<div class="whead"><span class="wmark" translate="no">Demet</span><span class="wtag">sevgiyle büyüyen bir bahçe</span></div>
    <div class="wcard" role="dialog" aria-modal="true" aria-labelledby="wTitle"><div class="wstep" id="wStep"></div></div>`;
  const step = el.querySelector('#wStep');
  const intro = () => {
    step.innerHTML = `<h2 id="wTitle">Sevdiğine çiçek gönder, bahçeniz birlikte büyüsün</h2>
      <ul class="wperks">
        <li>${PERK}<span>3D buketini çiçek çiçek kendin yap, kağıdına sar, notunu yaz.</span></li>
        <li>${PERK}<span>Sevgiline, arkadaşına gönder; bildirim gitsin, buket onun ekranında açılsın.</span></li>
        <li>${PERK}<span>Her buket bahçene ekilir; sevgilinle olanlar ortak bahçenizde büyür.</span></li>
      </ul>
      <div class="wbtns"><button class="cta wide" id="wReg" type="button">Hesap oluştur</button><button class="btn2 wide" id="wLog" type="button">Hesabım var, giriş yap</button></div>
      <button class="linkbtn wguest" id="wGuest" type="button">Misafir olarak giriş yap</button>
      <p class="small" style="text-align:center;margin:0">Devam ederek <button class="linkbtn" data-legal="kosullar" style="padding:0;font-size:inherit">Kullanım koşullarını</button> ve <button class="linkbtn" data-legal="gizlilik" style="padding:0;font-size:inherit">Gizlilik politikasını</button> kabul etmiş olursun.</p>`;
    step.querySelectorAll('[data-legal]').forEach(b => b.onclick = () => openExternal(`${WEB}/${b.dataset.legal}`));
    step.querySelector('#wReg').onclick = () => form('register');
    step.querySelector('#wLog').onclick = () => form('login');
    step.querySelector('#wGuest').onclick = () => { try { localStorage.setItem('demet-welcomed', '1'); } catch (e) {} hideWelcome(); };
  };
  const form = m => {
    step.innerHTML = `<button class="wback" type="button" aria-label="Geri">${BACK_SVG}</button>
      <h2 id="wTitle">${AUTH_COPY[m][0]}</h2><p class="wsub">${AUTH_COPY[m][1]}</p>
      ${authHTML(m, 'w')}
      <button class="linkbtn wguest" type="button" id="wSwitch">${m === 'register' ? 'Zaten hesabın var mı? Giriş yap' : 'Hesabın yok mu? Hesap oluştur'}</button>`;
    step.querySelector('.wback').onclick = () => { intro(); step.querySelector('#wReg').focus(); };
    step.querySelector('#wSwitch').onclick = () => form(m === 'register' ? 'login' : 'register');
    bindAuth(step, m, 'w', afterAuth);
    const first = step.querySelector('input'); if (first && matchMedia('(hover: hover)').matches) first.focus();
  };
  intro();
  el.hidden = false; requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  welcomeFrame(); setView('garden', { quiet: true });
}
function hideWelcome() {
  if (!welcomeOpen) return;
  welcomeOpen = false;
  const el = $('welcome'); el.classList.remove('show');
  $('app').classList.remove('welcoming'); welcomeFrame();
  setTimeout(() => { el.hidden = true; el.innerHTML = ''; }, 500);
  setView(hashView());
}
async function openPairLanding(code) {
  history.replaceState(null, '', '/');
  let info;
  try { info = await api(`/invite/${code}`); }
  catch (e) { openSheet(`<h3 id="sheetTitle">Davet geçersiz</h3><p class="sub">${esc(e.message)} Davet eden kişiden yeni bir link iste.</p>`); return; }
  const friend = info.kind === 'friend', fn = info.fromName;
  if (info.already) { openSheet(`<h3 id="sheetTitle">${friend ? `${esc(fn)} zaten arkadaşın` : `${esc(fn)} ile ortak bahçeniz zaten açık`}</h3><p class="sub">Ona doğrudan buket gönderebilirsin.</p>`); return; }
  if (!friend && ME.partner) { openSheet(`<h3 id="sheetTitle">Zaten bir sevgilin ekli</h3><p class="sub">${esc(ME.partner.name)} ile ortak bahçen var. ${esc(fn)} ile ortak bahçe kurmak için önce Hesabım’dan sevgilini kaldır.</p>`); return; }
  if (!friend && info.taken) { openSheet(`<h3 id="sheetTitle">Bu davet artık geçerli değil</h3><p class="sub">${esc(fn)} başka biriyle ortak bahçe kurmuş.</p>`); return; }
  openSheet(`<div class="unl"><div class="av ${friend ? '' : 'heart'}" style="width:72px;height:72px;font-size:30px" aria-hidden="true">${esc(fn.charAt(0).toLocaleUpperCase('tr'))}</div>
      <div><h3 id="sheetTitle">${esc(fn)} seni ${friend ? 'arkadaş' : 'sevgilisi'} olarak ekledi</h3><p class="sub" style="margin-top:4px">${friend ? 'Birbirinize doğrudan buket gönderebilirsiniz. Gelen buketler kendi bahçende durur.' : 'Kabul edince ortak bahçeniz açılır. Birbirinize gönderdiğiniz buketler Bahçemiz’de büyür.'}</p></div></div>
    <div class="field"><label for="pairName">Adın</label><input id="pairName" value="${esc(ME.name === 'Misafir' ? '' : ME.name)}" maxlength="24" autocomplete="given-name" placeholder="Örneğin Elif…"></div>
    <p class="err" id="pairErr" role="alert" hidden></p>
    <div class="acts"><button class="btn2" data-close>Şimdi değil</button><button class="cta" id="doPair" data-autofocus>${friend ? 'Arkadaş ol' : 'Kabul et'}</button></div>`, sh => {
    sh.querySelector('#doPair').onclick = async () => {
      const er = sh.querySelector('#pairErr'), nm = sh.querySelector('#pairName').value.trim();
      if (!nm) { er.textContent = `${fn} seni tanısın diye adını yaz.`; er.hidden = false; return; }
      try {
        if (nm !== ME.name) applyMe(await api('/me', { method: 'PATCH', body: { name: nm } }));
        applyMe(await api(`/invite/${code}/accept`, { body: {} }));
        closeSheet(); toast(friend ? `${fn} ile artık arkadaşsınız` : `${fn} ile ortak bahçeniz açıldı`); loadHistory();
        if (!friend) { gMode = 'ours'; W.gMode = 'ours'; save(); }
        if (isGuest()) { setTimeout(() => openAuth('register'), 700); return; }
        if (await pushState() === 'off') setTimeout(() => openSheet(`<h3 id="sheetTitle">Buket gelince haber verelim mi?</h3><p class="sub">${esc(fn)} sana buket gönderince bildirim gelsin.</p>
          <div class="acts"><button class="btn2" data-close>Şimdi değil</button><button class="cta" id="okPush" data-autofocus>Bildirimleri aç</button></div>`, s3 => {
            s3.querySelector('#okPush').onclick = async () => { if (await enablePush()) { closeSheet(); toast('Bildirimler açıldı'); } };
          }), 600);
      } catch (e) { er.textContent = e.message; er.hidden = false; }
    };
  });
}
$('meBtn').addEventListener('click', () => (isGuest() ? openAuth('register') : openAccount()));

/* ---- views */
function hashView() { return location.hash === '#bahce' || location.hash === '#bahcemiz' ? 'garden' : 'studio'; }
function preferredGarden() { return online() && ME.partner && W.gMode !== 'mine' ? 'bahcemiz' : 'bahce'; }
function setGardenMode(m) {
  W.gMode = m; save();
  const hsh = m === 'ours' ? '#bahcemiz' : '#bahce';
  if (location.hash !== hsh) location.hash = hsh; else setView('garden');
}
document.getElementById('gswitch').addEventListener('click', e => { const b = e.target.closest('[data-gmode]'); if (b && b.dataset.gmode !== gMode) setGardenMode(b.dataset.gmode); });
function renderSwitch() {
  const el = $('gswitch'); el.hidden = view !== 'garden' || !!viewing || !online();
  el.querySelectorAll('[data-gmode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.gmode === gMode)));
}
async function setView(v, opt = {}) {
  view = v; sQ.skip = 90; sQ.frames.length = 0;
  if (v === 'garden') { const m = location.hash === '#bahcemiz' ? 'ours' : 'mine'; if (m !== gMode) { gMode = m; gFocus = null; } }
  renderSwitch();
  const g = v === 'garden';
  stage.classList.toggle('garden', g); $('app').classList.toggle('in-garden', g); gardenDpr();
  controls.enabled = !g; gControls.enabled = g;
  document.getElementById('empty').hidden = g || S.items.length > 0;
  $('hint').style.opacity = '';
  $('hint').textContent = g ? 'Bir buketin yanına dokun, notunu aç' : 'Parmağınla çevir, iki parmakla yakınlaş';
  if (selRing) selRing.visible = false; gFocus = null;
  renderTop(); renderTabs(); renderPane(); renderFoot();
  if (online()) showInbox();
  if (g) {
    if (!TL.rose) {
      const L = $('loading');
      if (!opt.quiet) { L.style.display = ''; L.style.opacity = '1'; L.querySelector('strong').textContent = 'Bahçe hazırlanıyor…'; $('loadText').textContent = 'Buketler toprağa ekiliyor…'; }
      try { await loadGarden(); } catch (err) { toast('Bahçe yüklenemedi. Sayfayı yenileyip tekrar dene.'); }
      if (!opt.quiet) { L.style.opacity = '0'; setTimeout(() => { L.style.display = 'none'; }, 500); }
      if (view !== 'garden') return;
    }
    buildGarden(); placeGardenCam();
  }
}
window.addEventListener('hashchange', () => { if (!viewing) setView(hashView()); });

/* ---- boot */
resize(); placeCamera(); renderTop(); renderTabs(); renderPane(); renderFoot();
requestAnimationFrame(tick);
let SUPPORT = null;
const serverCheck = fetch(apiUrl('/api/health'), { cache: 'no-store' }).then(r => r.ok && r.json()).then(j => { serverOK = !!(j && j.ok); SUPPORT = (j && j.support) || null; }).catch(() => { serverOK = false; });
(async () => {
  try {
    const pack = await fetchPack('models.json', p => { $('loadBar').style.width = `${p * 80}%`; });
    let done = 0; const total = Object.keys(pack).length;
    await parsePack(pack, T, () => { done++; $('loadBar').style.width = `${80 + (done / total) * 20}%`; });
    await document.fonts.load('600 40px Caveat').catch(() => {});
  } catch (err) {
    $('loading').innerHTML = '<div><strong>Çiçekler yüklenemedi</strong>Bağlantını kontrol edip sayfayı yenile.</div>';
    return;
  }
  const wrapModel = T.wrap; prepWrap(wrapModel); wrapGroup.add(wrapModel);
  ribbonModel = T.ribbon; ribbonModel.position.y = -TIE; ribbonHolder.add(ribbonModel);
  ribbonPearls = new THREE.Group();
  for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, p = new THREE.Mesh(new THREE.SphereGeometry(0.0055, 10, 8), mat('pearl', '', '#F7F2EC')); p.position.set(Math.cos(a) * 0.066, 0.0, Math.sin(a) * 0.066); ribbonPearls.add(p); }
  ribbonHolder.add(ribbonPearls);
  buildTeddy();
  wrapP = S.wrapped && S.items.length ? 1 : 0; applyWrap(wrapP);
  sync3D(); renderFoot();
  await Promise.race([warmShaders(), new Promise(r => setTimeout(r, 3000))]);
  await serverCheck;
  if (serverOK) { try { await ensureSession(); } catch (e) { serverOK = false; } }
  if (serverOK && !NATIVE && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  if (NATIVE) { if (online()) { registerNativePush(false); iapReady(); } NATIVE.ready(); }
  const L = $('loading'); L.style.opacity = '0'; setTimeout(() => { L.style.display = 'none'; }, 500);
  const q = new URLSearchParams(location.search);
  if (q.has('odeme') && !NATIVE) {
    toast(q.get('odeme') === 'basarili' ? `Ödeme tamamlandı. +${fmt(+q.get('altin') || 0)} altın eklendi` : 'Ödeme tamamlanamadı. Kartından para çekildiyse birkaç dakika içinde iade edilir.');
    history.replaceState(null, '', '/' + location.hash);
  }
  let hello = null; try { hello = JSON.parse(sessionStorage.getItem('demet-hello') || 'null'); sessionStorage.removeItem('demet-hello'); } catch (e) {}
  if (hello && hello.deleted) setTimeout(() => toast('Hesabın silindi. Seni özleyeceğiz.'), 600);
  else if (hello) setTimeout(() => toast(hello.merged ? `Tekrar hoş geldin ${hello.name}. Bu cihazdaki buketler hesabına taşındı.` : `Tekrar hoş geldin ${hello.name}`), 600);
  let welcomed = false; try { welcomed = !!localStorage.getItem('demet-welcomed'); } catch (e) {}
  if (VIEW_ID && serverOK) startViewing(VIEW_ID);
  else {
    if (online()) loadHistory();
    if (PAIR_CODE && online()) openPairLanding(PAIR_CODE);
    else if (isGuest() && !welcomed && !q.has('odeme')) showWelcome();
    else if (hashView() === 'garden') setView('garden');
  }
})();
</script>
